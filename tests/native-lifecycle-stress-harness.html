<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>PENA native lifecycle stress</title>
  <link rel="stylesheet" href="../extension/injected.css">
  <style>
    html, body { margin: 0; width: 420px; height: 760px; overflow: hidden; }
    .test-host { width: 380px; height: 720px; display: flex; flex-direction: column; }
    .test-host[hidden] { display: none; }
    .test-header { height: 44px; flex: 0 0 44px; padding: 6px; box-sizing: border-box; }
    .test-header input { width: 100%; height: 30px; }
    .bx-im-list-container-recent__container,
    .bx-im-list-container-task__container { width: 380px; min-height: 0; flex: 1 1 auto; }
    .bx-im-list-container-recent__scroll-container,
    .bx-im-list-container-task__scroll-container { width: 380px; height: 100%; overflow-y: auto; }
    .bx-im-list-container-recent__elements,
    .bx-im-list-container-task__elements { width: 380px; min-height: 2000px; }
    .bx-im-list-recent-item__wrap, .bx-im-list-item { width: 360px; height: 56px; }
    .bx-im-list-recent-item__container, .bx-im-list-item__container { display: flex; align-items: center; height: 56px; padding: 0 8px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="test-host recent-host">
    <div class="test-header bx-im-list-container-recent__header_container"><input type="search" placeholder="Найти чат"></div>
  </div>
  <div class="test-host task-host" hidden>
    <div class="test-header bx-im-list-container-task__header_container"><input type="search" placeholder="Найти задачу"></div>
  </div>
  <script>
	window.__PENA_TEST_MANAGED_CATALOG__ = true;
    (() => {
	  window.__PENA_FORCE_REST_CATALOG__ = true;
      const rows = Array.from({ length: 32 }, (_, index) => ({ id: `chat${index + 1}`, title: `Диалог ${index + 1}` }));
      const createShell = (mode, generation = 0) => {
        const task = mode === 'tasks';
        const shell = document.createElement('div');
        shell.className = task ? 'bx-im-list-container-task__container' : 'bx-im-list-container-recent__container';
        shell.dataset.generation = String(generation);
        const viewport = document.createElement('div');
        viewport.className = task ? 'bx-im-list-container-task__scroll-container' : 'bx-im-list-container-recent__scroll-container';
        const list = document.createElement('div');
        list.className = task ? 'bx-im-list-container-task__elements' : 'bx-im-list-container-recent__elements';
        rows.forEach(item => {
          const row = document.createElement('div');
          row.className = task ? 'bx-im-list-item bx-im-list-recent-item__wrap' : 'bx-im-list-recent-item__wrap';
          row.dataset.id = item.id;
          row.innerHTML = `<div class="${task ? 'bx-im-list-item__container' : 'bx-im-list-recent-item__container'}"><span class="bx-im-chat-title__text"></span></div>`;
          row.querySelector('.bx-im-chat-title__text').textContent = `${item.title} / ${generation}`;
          list.appendChild(row);
        });
        viewport.appendChild(list);
        shell.appendChild(viewport);
        return shell;
      };
      document.querySelector('.recent-host').appendChild(createShell('chats'));
      document.querySelector('.task-host').appendChild(createShell('tasks'));
      const stored = rows.map((item, index) => ({ ...item, addedAt: Date.now() - index }));
      for (const mode of ['chats', 'tasks']) {
        localStorage.setItem(`pena.dialogControl.v1.${mode}`, JSON.stringify(stored));
        localStorage.setItem(`pena.dialogControlNative.v1.${mode}`, '1');
        localStorage.setItem(`pena.dialogControlView.${mode}`, JSON.stringify({ sortMode: 'date', sortDirection: 'desc', unreadOnly: false }));
      }
      window.BX = { rest: { callMethod(method, params, callback) {
        callback({ error: () => null, data: () => ({ items: [] }), next: () => false, total: () => 0 });
      } } };
      window.__lifecycleCreateShell = createShell;
    })();
  </script>
  <script src="../extension/native-catalog.js"></script>
  <script src="../extension/native-interaction-state.js"></script>
  <script src="../extension/native-time-control.js"></script>
  <script src="../extension/native-lifecycle.js"></script>
  <script src="../extension/injected.js"></script>
  <script>
    (() => {
      const frame = () => new Promise(resolve => requestAnimationFrame(resolve));
      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
      const visibleSwitchers = () => Array.from(document.querySelectorAll('.pena-native-folder-switcher')).filter(panel => {
        const rect = panel.getBoundingClientRect();
        const style = getComputedStyle(panel);
        return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) !== 0 && rect.width > 0 && rect.height > 0;
      });
      const stats = {
        frameSamples: 0,
        mutationFrames: 0,
        maxVisible: 0,
        duplicateFrames: 0,
        invalidMountFrames: 0,
        settledMissing: 0,
        settledWrongHost: 0,
        settledOffsets: [],
        settledContexts: [],
        iterations: 0
      };
      let running = false;
      let mutationFramePending = false;
      const sample = source => {
        const panels = visibleSwitchers();
        stats.frameSamples += 1;
        if (source === 'mutation') stats.mutationFrames += 1;
        stats.maxVisible = Math.max(stats.maxVisible, panels.length);
        if (panels.length > 1) stats.duplicateFrames += 1;
        if (panels.some(panel => panel.parentElement === document.body || panel.getBoundingClientRect().width > 500)) stats.invalidMountFrames += 1;
      };
      const observer = new MutationObserver(() => {
        if (mutationFramePending) return;
        mutationFramePending = true;
        requestAnimationFrame(() => {
          mutationFramePending = false;
          sample('mutation');
        });
      });
      observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden', 'style'] });
      const monitor = () => {
        if (!running) return;
        sample('continuous');
        requestAnimationFrame(monitor);
      };
      const waitForActivePanel = async host => {
        const deadline = performance.now() + 700;
        while (performance.now() < deadline) {
          const panels = visibleSwitchers();
          if (panels.length === 1 && host.contains(panels[0])) return panels[0];
          await frame();
        }
        return visibleSwitchers()[0] || null;
      };

      window.__lifecycleHarness = {
        async run(iterations = 20) {
          running = true;
          requestAnimationFrame(monitor);
          const recentHost = document.querySelector('.recent-host');
          const taskHost = document.querySelector('.task-host');
          for (let index = 0; index < iterations; index += 1) {
            const mode = index % 2 === 0 ? 'tasks' : 'chats';
            const target = mode === 'tasks' ? taskHost : recentHost;
            const other = mode === 'tasks' ? recentHost : taskHost;
            const previousShell = target.querySelector('[class*="__container"]');
            previousShell?.replaceWith(window.__lifecycleCreateShell(mode, index + 1));
            other.hidden = true;
            target.hidden = false;
            const panel = await waitForActivePanel(target);
            await frame();
            await frame();
            const visible = visibleSwitchers();
            if (visible.length !== 1) stats.settledMissing += 1;
            if (!panel || !target.contains(panel)) stats.settledWrongHost += 1;
            if (panel) {
              const hostRect = target.getBoundingClientRect();
              stats.settledOffsets.push(Math.round((panel.getBoundingClientRect().top - hostRect.top) * 10) / 10);
            }
			const activeContext = window.__PENA_ACTIVE_LIST_CONTEXT__;
			stats.settledContexts.push({
			  expected: mode,
			  active: activeContext?.mode || '',
			  generation: activeContext?.list?.parentElement?.parentElement?.dataset?.generation || '',
			  panelHost: panel?.parentElement?.className || ''
			});
            stats.iterations += 1;
            await wait(20);
          }
          running = false;
          await frame();
          sample('final');
          return { ...stats, finalVisible: visibleSwitchers().length };
        }
      };
    })();
  </script>
</body>
</html>
