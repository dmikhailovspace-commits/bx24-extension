<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>PENA native consistency harness</title>
  <link rel="stylesheet" href="../extension/injected.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font: 16px/2 Georgia, serif; color: purple; }
    button { font: 18px/2 Georgia, serif; letter-spacing: 3px; text-transform: uppercase; }
    .test-host { width: 360px; height: 680px; }
    .test-host[hidden] { display: none; }
    .bx-im-list-container-recent__container,
    .bx-im-list-container-task__container { width: 360px; height: 680px; }
    .bx-im-list-container-recent__scroll-container,
    .bx-im-list-container-task__scroll-container,
    .bx-im-list-recent__scroll-container,
    .bx-im-list-task__scroll-container { width: 360px; height: 600px; overflow-y: auto; }
    .bx-im-list-container-recent__elements,
    .bx-im-list-container-task__elements { width: 360px; min-height: 600px; }
    .bx-im-list-recent-item__wrap,
    .bx-im-list-item { width: 340px; height: 64px; }
    .bx-im-list-recent-item__wrap.is-pinned,
    .bx-im-list-item.is-pinned { height: 72px; }
    .bx-im-list-recent-item__container,
    .bx-im-list-item__container { display: flex; align-items: center; height: 64px; padding-left: 2px; }
	.bx-im-list-recent-item__avatar,.bx-im-avatar__container { display: inline-flex; width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; }
	.bx-im-list-recent-item__avatar { margin-right: 8px; }
	.test-avatar { width: 40px; height: 40px; flex: 0 0 40px; margin-right: 8px; border-radius: 50%; background: #94a3b8; }
	.bx-im-avatar__container>.test-avatar { display:block; margin-right:0; }
	.is-selected > .bx-im-list-recent-item__container,
	.is-selected > .bx-im-list-item__container { padding-left: 0; }
    #anit-filters, #anit-dialog-control-dock { display: none !important; }
  </style>
</head>
<body>
  <div class="test-host recent-host">
	<div class="bx-im-list-container-recent__header_container"><input type="search" placeholder="Найти чат"></div>
    <div class="bx-im-list-container-recent__container">
      <div class="bx-im-list-container-recent__scroll-container">
        <div class="bx-im-list-container-recent__elements">
		  <div class="bx-im-list-recent-item__wrap is-pinned" data-id="chat225"><div class="bx-im-list-recent-item__container"><span class="test-avatar"></span><span class="bx-im-chat-title__text">Чат 225</span><span class="bx-im-list-recent-item__counter_number">3</span></div></div>
		  <div class="bx-im-list-recent-item__wrap" data-id="chat5"><div class="bx-im-list-recent-item__container"><span class="test-avatar"></span><span class="bx-im-chat-title__text">Чат 5</span></div></div>
		  <div class="bx-im-list-recent-item__wrap" data-id="chat77"><span class="test-avatar"></span><span class="bx-im-chat-title__text">Прямая строка</span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="test-host task-host" hidden>
	<div class="bx-im-list-container-task__header_container"><input type="search" placeholder="Найти задачу"></div>
    <div class="bx-im-list-container-task__container">
      <div class="bx-im-list-container-task__scroll-container">
        <div class="bx-im-list-container-task__elements">
		  <div class="bx-im-list-item bx-im-list-recent-item__wrap is-pinned" data-id="chat225" data-task-id="225"><div class="bx-im-list-item__container"><span class="test-avatar"></span><span class="bx-im-chat-title__text">Чат 225</span><span class="bx-im-list-recent-item__counter_number">3</span></div></div>
		  <div class="bx-im-list-item bx-im-list-recent-item__wrap" data-id="chat5" data-task-id="5"><div class="bx-im-list-item__container"><span class="test-avatar"></span><span class="bx-im-chat-title__text">Чат 5</span></div></div>
		  <div class="bx-im-list-item bx-im-list-recent-item__wrap" data-id="chat77" data-task-id="77"><span class="test-avatar"></span><span class="bx-im-chat-title__text">Прямая строка</span></div>
        </div>
      </div>
    </div>
  </div>
  <button id="switch-mode" type="button">Переключить тестовый режим</button>
  <button id="dispatch-wheel" type="button">Проверить событие колеса</button>
<script>
	document.querySelectorAll('.recent-host input[type="search"],.task-host input[type="search"]').forEach(input => { input.value = ''; });
	const nativePassThrough = new URLSearchParams(location.search).get('passThrough') === '1';
	if (nativePassThrough) {
	  document.querySelectorAll('[data-id="chat225"] .test-avatar').forEach(avatar => {
		const outer = document.createElement('span');
		outer.className = 'bx-im-list-recent-item__avatar';
		const inner = document.createElement('span');
		inner.className = 'bx-im-avatar__container';
		avatar.replaceWith(outer);
		inner.appendChild(avatar);
		outer.appendChild(inner);
	  });
	}
	window.__PENA_FORCE_REST_CATALOG__ = new URLSearchParams(location.search).get('nativeCatalog') !== '1';
	window.__PENA_TEST_API_CATALOG__ = nativePassThrough &&
		new URLSearchParams(location.search).get('nativeCatalog') === '1' &&
		new URLSearchParams(location.search).get('nativeFirst') !== '1';
	window.__PENA_TEST_NATIVE_SCROLL_MAX_MS__ = Math.max(0, Number(new URLSearchParams(location.search).get('startupBudget')) || 0);
	window.__PENA_TEST_DIALOG_CATALOG_TTL_MS__ = Math.max(0, Number(new URLSearchParams(location.search).get('catalogTtl')) || 0);
	window.__PENA_TEST_DIALOG_DEEP_IDLE_MS__ = Math.max(0, Number(new URLSearchParams(location.search).get('deepIdle')) || 0);
	window.__PENA_TEST_DIALOG_HEAD_TTL_MS__ = Math.max(0, Number(new URLSearchParams(location.search).get('headTtl')) || 0);
	window.__PENA_TEST_DIALOG_HEAD_TIMEOUT_MS__ = Math.max(0, Number(new URLSearchParams(location.search).get('headTimeout')) || 0);
	window.__PENA_TEST_MANAGED_CATALOG__ = !nativePassThrough;
	window.__PENA_TEST_NATIVE_SCROLL__ = !nativePassThrough &&
		new URLSearchParams(location.search).get('nativeCatalog') === '1' &&
		new URLSearchParams(location.search).get('managedApi') !== '1';
    const mode = new URLSearchParams(location.search).get('mode') === 'tasks' ? 'tasks' : 'chats';
	const clonePanel = new URLSearchParams(location.search).get('clone') === '1';
	const relocatePanel = new URLSearchParams(location.search).get('relocate') === '1';
	const duplicateLists = new URLSearchParams(location.search).get('duplicate') === '1';
	const transformedView = new URLSearchParams(location.search).get('transform') === '1';
	const allUnread = new URLSearchParams(location.search).get('allUnread') === '1';
	const shortList = new URLSearchParams(location.search).get('short') === '1';
	if (shortList) localStorage.removeItem('pena.dialogRecentCache.v2');
	const manyRows = new URLSearchParams(location.search).get('many') === '1';
	const lazyRows = new URLSearchParams(location.search).get('lazy') === '1';
	const rematerializeOnReturn = new URLSearchParams(location.search).get('rematerializeOnReturn') === '1';
	const catalogRows = Math.max(0, Number(new URLSearchParams(location.search).get('catalogRows')) || (manyRows ? 120 : 18));
	const lazyChunk = Math.max(1, Number(new URLSearchParams(location.search).get('lazyChunk')) || 4);
	const lazyDelay = Math.max(0, Number(new URLSearchParams(location.search).get('lazyDelay')) || 0);
	const detailDelay = Math.max(0, Number(new URLSearchParams(location.search).get('detailDelay')) || 0);
	const restDelay = Math.max(0, Number(new URLSearchParams(location.search).get('restDelay')) || 0);
	const deltaTimeout = new URLSearchParams(location.search).get('deltaTimeout') === '1';
	const restIncompleteZero = new URLSearchParams(location.search).get('restIncompleteZero') === '1';
	const restUnknownTotal = new URLSearchParams(location.search).get('restUnknownTotal') === '1';
	let recentListFailuresRemaining = Math.max(0, Number(new URLSearchParams(location.search).get('restFailCount')) || 0);
	const generatedManaged = new URLSearchParams(location.search).get('generatedManaged') === '1';
	const wideParent = new URLSearchParams(location.search).get('wide') === '1';
	const nestedViewport = new URLSearchParams(location.search).get('nestedViewport') === '1';
	const descendantViewport = new URLSearchParams(location.search).get('descendantViewport') === '1';
	const legacyNativeOff = new URLSearchParams(location.search).get('legacyNativeOff') === '1';
    document.querySelector('.recent-host').hidden = mode === 'tasks';
    document.querySelector('.task-host').hidden = mode !== 'tasks';
	if (nestedViewport) {
	  document.querySelectorAll('.bx-im-list-container-recent__elements,.bx-im-list-container-task__elements').forEach(list => {
		const wrapper = document.createElement('div');
		wrapper.className = list.classList.contains('bx-im-list-container-task__elements')
		  ? 'bx-im-list-container-task__elements_container'
		  : 'bx-im-list-container-recent__elements_container';
		wrapper.style.cssText = 'height:600px;overflow:hidden';
		list.replaceWith(wrapper);
		wrapper.appendChild(list);
	  });
	}
	if (descendantViewport) {
	  document.querySelectorAll('.bx-im-list-container-recent__elements,.bx-im-list-container-task__elements').forEach(list => {
		const oldViewport = list.parentElement;
		const outerHost = oldViewport.parentElement;
		const task = list.classList.contains('bx-im-list-container-task__elements');
		const elementsContainer = document.createElement('div');
		elementsContainer.className = task
		  ? 'bx-im-list-container-task__elements_container'
		  : 'bx-im-list-container-recent__elements_container';
		elementsContainer.style.cssText = 'height:600px;overflow:hidden';
		const innerContainer = document.createElement('div');
		innerContainer.className = task ? 'bx-im-list-task__container' : 'bx-im-list-recent__container';
		const innerScroll = document.createElement('div');
		innerScroll.className = task ? 'bx-im-list-task__scroll-container' : 'bx-im-list-recent__scroll-container';
		Array.from(list.children).forEach(row => innerScroll.appendChild(row));
		innerContainer.appendChild(innerScroll);
		list.appendChild(innerContainer);
		oldViewport.replaceWith(elementsContainer);
		elementsContainer.appendChild(list);
	  });
	}
	const getNativeRowHost = list => list?.querySelector?.(':scope > .bx-im-list-recent__container > .bx-im-list-recent__scroll-container,:scope > .bx-im-list-task__container > .bx-im-list-task__scroll-container') || list;
	if (duplicateLists && mode === 'chats') {
	  const stale = document.createElement('div');
	  stale.className = 'stale-test-host';
	  stale.style.cssText = 'position:fixed;left:0;top:0;width:360px;height:680px;z-index:0';
	  stale.innerHTML = '<div class="bx-im-list-container-recent__header_container"><input type="search" placeholder="Найти чат"></div><div class="bx-im-list-container-recent__container"><div class="bx-im-list-container-recent__scroll-container"><div class="bx-im-list-container-recent__elements"><div class="bx-im-list-recent-item__wrap" data-id="chat999"><span class="bx-im-chat-title__text">Устаревший экран</span></div></div></div></div>';
	  const active = document.querySelector('.recent-host');
	  active.style.position = 'relative';
	  active.style.zIndex = '2';
	  active.before(stale);
	}
	if (wideParent) {
	  document.querySelectorAll('.bx-im-list-container-recent__container,.bx-im-list-container-task__container').forEach(node => { node.style.width = '1000px'; });
	  document.querySelectorAll('.bx-im-list-container-recent__scroll-container,.bx-im-list-container-task__scroll-container').forEach(node => { node.style.marginLeft = '120px'; });
	}
    const now = Date.now();
    const items = [
      { id: 'folder:test', type: 'folder', title: 'Тестовая папка', color: '#f59e0b', icon: 'folder', addedAt: now },
      { id: 'chat225', title: 'Диалог 225', color: '#22c55e', folderId: 'folder:test', addedAt: now },
      { id: 'chat5', title: 'Диалог 5', addedAt: now - 1 },
	  { id: 'chat77', title: 'Прямая строка', addedAt: now - 2 }
    ];
    if (new URLSearchParams(location.search).get('pendingControl') === '1') {
	  items.push({ id: 'chat9000', title: 'Старый диалог в папке', folderId: 'folder:test', addedAt: now - 999999 });
	}
	if (manyRows) items.push({ id: 'folder:colors', type: 'folder', title: 'Цветовая сортировка', icon: 'folder', addedAt: now - 50 });
    if (!shortList) document.querySelectorAll('.bx-im-list-container-recent__elements,.bx-im-list-container-task__elements').forEach(list => {
	  const rowHost = getNativeRowHost(list);
	  const template = rowHost.lastElementChild;
	  for (let index = 0; index < catalogRows; index += 1) {
        const row = template.cloneNode(true);
		const id = `chat${1000 + index}`;
		const title = `Заполнитель ${index + 1}`;
		row.dataset.id = id;
        row.querySelector('.bx-im-chat-title__text').textContent = title;
        rowHost.appendChild(row);
		if (!items.some(item => item.id === id)) {
		  const palette = ['', '#16a34a', '#eab308', '#3b82f6', '#ef4444'];
		  const color = palette[index % palette.length];
		  items.push({ id, title, ...(generatedManaged ? { recentManaged: true } : {}), ...(color && manyRows ? { color, folderId: 'folder:colors' } : {}), addedAt: now - 100 - index });
		}
      }
    });
	window.nativeMaterializationResets = 0;
	const nativeFullRows = new Map();
	const installLazyMaterialization = list => {
	  const rowHost = getNativeRowHost(list);
	  const modeKey = list.classList.contains('bx-im-list-container-task__elements') ? 'tasks' : 'chats';
	  if (!nativeFullRows.has(modeKey)) nativeFullRows.set(modeKey, Array.from(rowHost.children, row => row.cloneNode(true)));
	  const fullRows = nativeFullRows.get(modeKey);
	  rowHost.replaceChildren(...fullRows.slice(0, 10).map(row => row.cloneNode(true)));
	  const pending = fullRows.slice(10).map(row => row.cloneNode(true));
	  const viewport = list.querySelector('.bx-im-list-recent__scroll-container,.bx-im-list-task__scroll-container') ||
		list.closest('.bx-im-list-container-recent__scroll-container,.bx-im-list-container-task__scroll-container');
	  if (!viewport) return;
	  let loading = false;
	  viewport.addEventListener('scroll', () => {
		if (loading || viewport.scrollTop + viewport.clientHeight < viewport.scrollHeight - 2 || !pending.length) return;
		const append = () => {
		  pending.splice(0, lazyChunk).forEach(row => rowHost.appendChild(row));
		  loading = false;
		};
		if (lazyDelay > 0) {
		  loading = true;
		  setTimeout(append, lazyDelay);
		} else append();
	  });
	};
	if (lazyRows) document.querySelectorAll('.bx-im-list-container-recent__elements,.bx-im-list-container-task__elements').forEach(installLazyMaterialization);
	const initialScrollTop = Math.max(0, Number(new URLSearchParams(location.search).get('initialTop')) || 0);
	document.querySelectorAll(descendantViewport
	  ? '.bx-im-list-recent__scroll-container,.bx-im-list-task__scroll-container'
	  : '.bx-im-list-container-recent__scroll-container,.bx-im-list-container-task__scroll-container').forEach(viewport => {
	  if (nativePassThrough) viewport.style.overflowY = 'scroll';
	  viewport.scrollTop = initialScrollTop;
	});
	window.nativeScrollAudit = [];
	window.nativeScrollbarBaseline = {};
	document.querySelectorAll('.recent-host,.task-host').forEach(host => {
	  const key = host.classList.contains('task-host') ? 'tasks' : 'chats';
	  const viewport = host.querySelector('[class*="scroll-container"]');
	  if (!viewport) return;
	  const style = getComputedStyle(viewport);
	  window.nativeScrollbarBaseline[key] = {
		top: viewport.scrollTop,
		overflowY: style.overflowY,
		scrollbarWidth: style.scrollbarWidth || 'auto'
	  };
	  viewport.addEventListener('scroll', () => {
		window.nativeScrollAudit.push({ key, top: viewport.scrollTop, loader: !!host.querySelector('.pena-native-original-load-guard') });
	  });
	});
    ['chats', 'tasks'].forEach(storageMode => {
      localStorage.setItem(`pena.dialogControl.v1.${storageMode}`, JSON.stringify(items));
	  localStorage.setItem(`pena.dialogControlNative.v1.${storageMode}`, legacyNativeOff ? '0' : '1');
	  localStorage.setItem(`pena.dialogControlView.${storageMode}`, JSON.stringify({ sortMode: 'date', sortDirection: transformedView ? 'asc' : 'desc', unreadOnly: false }));
	  localStorage.setItem(`pena.filters.${storageMode}`, JSON.stringify({ query: '' }));
	  const segmentFixture = new URLSearchParams(location.search).get('segments') === '1'
		? [{ id: 'segment:target', title: 'Целевая группа', addedAt: now + 1 }]
		: [];
	  localStorage.setItem(`pena.dialogControlSegments.v1.${storageMode}`, JSON.stringify(segmentFixture));
	  localStorage.removeItem(`pena.dialogControlSegments.v1.active.${storageMode}`);
	  if (new URLSearchParams(location.search).get('activeFolder') === '1') {
		localStorage.setItem(`pena.dialogControlNativeFolder.v1.${storageMode}`, 'folder:test');
	  } else {
		localStorage.removeItem(`pena.dialogControlNativeFolder.v1.${storageMode}`);
	  }
    });
	window.nativeSearchRuns = 0;
	document.querySelectorAll('.recent-host input[type="search"],.task-host input[type="search"]').forEach(input => {
	  input.addEventListener('focus', () => input.closest('.test-host')?.classList.add('native-search-active'));
	  input.addEventListener('blur', () => input.closest('.test-host')?.classList.remove('native-search-active'));
	  input.addEventListener('input', () => {
		window.nativeSearchRuns += 1;
		input.closest('.test-host')?.classList.add('native-search-active');
		const query = String(input.value || '').trim().toLowerCase();
		const list = input.closest('.test-host')?.querySelector('.bx-im-list-container-recent__elements,.bx-im-list-container-task__elements');
		Array.from(getNativeRowHost(list)?.children || []).forEach(row => {
		  const title = String(row.querySelector('.bx-im-chat-title__text')?.textContent || '').toLowerCase();
		  row.style.display = !query || title.includes(query) ? '' : 'none';
		});
	  });
	});
	window.nativeRowClicks = [];
	window.nativeContextMenus = 0;
	document.addEventListener('contextmenu', event => {
	  const row = event.target.closest?.('.bx-im-list-recent-item__wrap,.bx-im-list-item');
	  if (!row || !row.closest('.test-host')) return;
	  window.nativeContextMenus += 1;
	  event.preventDefault();
	  document.getElementById('bitrix-native-menu')?.remove();
	  const menu = document.createElement('div');
	  menu.id = 'bitrix-native-menu';
	  menu.className = 'menu-popup';
	  menu.setAttribute('role', 'menu');
	  menu.innerHTML = '<div class="menu-popup-item" role="menuitem"><span class="menu-popup-item-text">Отключить звук</span></div>';
	  document.body.appendChild(menu);
	});
	document.addEventListener('click', event => {
	  const row = event.target.closest?.('[data-id]');
	  if (row) {
		window.nativeRowClicks.push(String(row.dataset.id || ''));
		if (nativePassThrough) setTimeout(() => {
		  const input = row.closest('.test-host')?.querySelector('input[type="search"]');
		  if (!input) return;
		  input.value = '';
		  input.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'deleteContentBackward' }));
		}, 0);
	  } else if (nativePassThrough && event.target.closest?.('#dispatch-wheel')) {
		const input = document.querySelector('.test-host:not([hidden]) input[type="search"]');
		if (input) {
		  input.value = '';
		  input.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'deleteContentBackward' }));
		}
	  }
	});
	const recentEntries = items.filter(item => item.type !== 'folder').map((item, index) => ({
	  dialog_id: item.id,
	  chat_id: Number(String(item.id).replace(/^chat/, '')),
	  type: 'chat',
	  title: document.querySelector(`[data-id="${item.id}"] .bx-im-chat-title__text`)?.textContent || item.title,
	  avatar: { url: `https://cdn.example.test/${item.id}.png`, color: '#dbeafe' },
	  counter: allUnread || index % 6 === 0 ? 2 : 0,
	  message: {
		id: 10000 - index,
		text: `Сообщение ${item.title}`,
		date: new Date(item.addedAt).toISOString()
	  }
	}));
	const taskRecentGeneric = new URLSearchParams(location.search).get('taskRecentGeneric') === '1';
	const taskCatalogRows = Math.max(0, Number(new URLSearchParams(location.search).get('taskCatalogRows')) || 24);
	const taskCatalogEntries = Array.from({ length: taskCatalogRows }, (_, index) => {
		const taskId = String(50000 + index);
		return {
			ID: taskId,
			TITLE: `Каталожная задача ${index + 1}`,
			CHAT_ID: taskId,
			ALLOW_TIME_TRACKING: 'Y',
			ACTIVITY: new Date(Date.UTC(2025, 0, 1 + (index % 28), 9, 0, 0)).toISOString()
		};
	}).concat(['101', '102', '303', '404', '405'].map(taskId => ({
		ID: taskId,
		TITLE: `Задача ${taskId}`,
		CHAT_ID: taskId,
		ALLOW_TIME_TRACKING: taskId === '405' ? 'N' : 'Y',
		ACTIVITY: taskId === '404' ? '2024-01-15T09:00:00.000Z' : `2026-01-${String((Number(taskId) % 20) + 1).padStart(2, '0')}T09:00:00.000Z`
	})));
	window.timeRestCalls = [];
	window.timeAddCalls = [];
	window.timeAddedItems = [];
	window.timeDeletedItems = [];
	window.timeSeedItems = null;
	window.timeAddFailures = 0;
	window.timeListFailures = 0;
	window.timeListTimeoutFailures = 0;
	window.timeTaskSearchFailures = 0;
	window.nativeRestCalls = [];
	window.nativeBatchCalls = 0;
	window.nativeBatchSizes = [];
	const recentPageResult = params => {
	  const offset = Math.max(0, Number(params?.OFFSET) || 0);
	  const limit = Math.max(1, Number(params?.LIMIT) || 50);
	  const taskMode = !document.querySelector('.task-host')?.hidden;
	  const availableEntries = restIncompleteZero ? recentEntries.slice(0, 164) : recentEntries;
	  const pageItems = availableEntries.slice(offset, offset + limit).map(entry => taskMode && !taskRecentGeneric ? {
		...entry,
		chat: {
		  ...(entry.chat || {}),
		  type: 'taskstask',
		  entity_type: 'TASKS_TASK',
		  entity_id: String(entry.chat_id)
		},
		entity_link: { type: 'TASKS', id: String(entry.chat_id) }
	  } : entry);
	  const next = offset + limit < availableEntries.length ? offset + limit : null;
	  return {
		error: () => null,
		data: () => ({ items: pageItems, hasMore: next != null, hasMorePages: next != null }),
		total: () => restUnknownTotal ? -1 : (restIncompleteZero ? 0 : availableEntries.length),
		next: () => restUnknownTotal ? false : next
	  };
	};
	window.nativeCustomEventHandlers = new Map();
	window.dispatchNativeSidePanelTask = taskId => {
	  const url = `/company/personal/user/7/tasks/task/view/${taskId}/`;
	  const event = { getSlider: () => ({ getUrl: () => url }) };
	  for (const name of ['SidePanel.Slider:onOpenComplete', 'SidePanel.Slider:onLoad']) {
		(window.nativeCustomEventHandlers.get(name) || []).forEach(handler => handler(event));
	  }
	};
	window.dispatchNativeTaskMessage = (dialogId, authorId = '7') => {
	  for (const name of ['onPullEvent-im', 'onPullEvent-im-v2']) {
		(window.nativeCustomEventHandlers.get(name) || []).forEach(handler => handler('messageChat', {
		  dialogId,
		  message: { dialogId, authorId }
		}));
	  }
	};
	window.BX = {
	  message(key) { return key === 'USER_ID' ? '7' : ''; },

	  const clone = value => JSON.parse(JSON.stringify(value));
	  window.__PENA_DIALOG_REPOSITORY__ = Object.freeze({
		get: async () => clone(repositorySnapshot),
		commit: async (_scope, records, meta) => {
		  const savedAt = Date.now();

			records: clone(records || []),
			manifest: { ...repositorySnapshot.manifest, ...clone(meta || {}), count: records?.length || 0, savedAt }
		  };
		  return { manifest: clone(repositorySnapshot.manifest), count: repositorySnapshot.records.length };
		},
		patch: async (_scope, records, deletedIds, meta) => {
		  const byId = new Map(repositorySnapshot.records.map(record => [record.id, record]));
		  (deletedIds || []).forEach(id => byId.delete(id));
		  (records || []).forEach(record => byId.set(record.id, clone(record)));
		  repositorySnapshot.records = Array.from(byId.values());
		  repositorySnapshot.manifest = { ...repositorySnapshot.manifest, ...clone(meta || {}), count: repositorySnapshot.records.length, savedAt: Date.now() };
		  return { manifest: clone(repositorySnapshot.manifest), count: repositorySnapshot.records.length };
		},
		acquire: async () => ({ acquired: true, expiresAt: Date.now() + 30000, retryAfterMs: 0 })
	  });
	}
	if (startupNativeQuery !== null) {
		document.querySelector('.test-host:not([hidden]) input[type="search"]')?.setAttribute('value', startupNativeQuery);
	}
	if (new URLSearchParams(location.search).get('autofocus') === '1') {
		document.querySelector('.test-host:not([hidden]) input[type="search"]')?.focus();
	}
