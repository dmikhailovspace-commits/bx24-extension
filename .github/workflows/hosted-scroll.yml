name: Hosted scroll measurements
on:
  push:
    branches: ['codex/hosted-scroll-qa']
permissions:
  contents: read
jobs:
  profile:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        area: [list, conversation]
        chunk: [50, 600]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Install Chromium
        shell: pwsh
        run: |
          npm install --global pnpm@10.17.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
      - name: Replay identical gestures in alternating version order
        shell: pwsh
        run: |
          $i=0
          foreach ($ref in @('v9.0.10','v9.0.12','v9.0.12','v9.0.10')) {
            $i++
            node tests/hosted-pagination-profile.mjs $ref ${{ matrix.area }} ${{ matrix.chunk }} $i
            if ($LASTEXITCODE) {exit $LASTEXITCODE}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scroll-${{ matrix.area }}-${{ matrix.chunk }}
          path: tests/artifacts/hosted/
