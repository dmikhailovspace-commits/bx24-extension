name: Recover verified 9.0.1 macOS build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-macos:
    name: Build and verify Universal DMG
    runs-on: macos-15-intel
    timeout-minutes: 20


    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fe202f0fedf3e168f813873df1f648f0b8dae38f

      - name: Verify prior successful frozen source and Windows gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fe202f0fedf3e168f813873df1f648f0b8dae38f"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/42672456319 --jq .head_sha)" = "fe202f0fedf3e168f813873df1f648f0b8dae38f"
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/42672456319/jobs > "$RUNNER_TEMP/source-jobs.json"
          node -e 'const j=require(process.env.RUNNER_TEMP+"/source-jobs.json").jobs;for(const n of ["Verify frozen release source","Build and verify Windows EXE"]){if(j.find(x=>x.name===n)?.conclusion!=="success")throw Error(n)}'
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/tags/v9.0.1 --jq .object.sha)" = "$(git rev-parse HEAD)"

      - name: Download exact source verification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Chrome-fe202f0fedf3e168f813873df1f648f0b8dae38f
          path: tests/artifacts/recovery-source-proof
          run-id: 42672456319
          github-token: ${{ github.token }}

      - name: Match all runtime hashes against successful search-focused 16
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const v=JSON.parse(fs.readFileSync('tests/artifacts/recovery-source-proof/verification.json','utf8'));
          assert.equal(v.status,'PASS');assert.equal(v.version,'9.0.1');assert.equal(v.verificationScope,'search-focused');assert.equal(v.gate.suites,16);
          assert.equal(Object.keys(v.gate.sourceSha256).length,19);
          for(const [p,h] of Object.entries(v.gate.sourceSha256))assert.equal(crypto.createHash('sha256').update(fs.readFileSync('extension/'+p)).digest('hex'),h,p);
          console.log('PASS exact frozen source; completed configured gate and Windows build');
          JS

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.7
          cache: false

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/bin/python3 -c 'import json; print(json.load(open("extension/manifest.json", encoding="utf-8"))["version"])')"
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest v${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify macOS update migration and consent
        shell: bash
        run: PENA_UPDATE_PLATFORM_ONLY=1 node tests/update-delivery-regression.mjs

      - name: Build Universal DMG
        shell: bash
        run: bash installers/macos/build.sh

      - name: Verify application and disk image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dmg="$GITHUB_WORKSPACE/dist/BX24_Chat_Sorter_macOS_Universal_v${VERSION}.dmg"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/pena-bx24-mount.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet 2>/dev/null || true
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          test -s "$dmg"
          hdiutil verify "$dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -noautoopen -mountpoint "$mount_dir"

          app="$mount_dir/BX24 Chat Sorter Installer.app"
          executable="$app/Contents/MacOS/BX24 Chat Sorter Installer"
          launcher="$app/Contents/Resources/pena-launcher"
          launcher_info="$app/Contents/Resources/launcher-Info.plist"
          test -d "$app"
          test -x "$executable"
          plutil -lint "$app/Contents/Info.plist"
          plutil -lint "$launcher_info"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = "12.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$launcher_info")" = "12.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$launcher_info")" = "__VERSION__"
          grep -Fq 's|__VERSION__|$VERSION|g' "$app/Contents/Resources/install-gui.sh"

          archs="$(lipo -archs "$executable")"
          [[ " $archs " == *" x86_64 "* ]]
          [[ " $archs " == *" arm64 "* ]]
          launcher_archs="$(lipo -archs "$launcher")"
          [[ " $launcher_archs " == *" x86_64 "* ]]
          [[ " $launcher_archs " == *" arm64 "* ]]

          visible_count="$(find "$mount_dir" -mindepth 1 -maxdepth 1 ! -name '.*' | wc -l | tr -d ' ')"
          test "$visible_count" = "1"
          test -d "$app/Contents/Resources/extension"
          test -x "$app/Contents/Resources/install-gui.sh"
          test -x "$app/Contents/Resources/pena-updater.sh"
          test -x "$launcher"

          if find "$app/Contents/Resources" -type f \( -name '*.sh' -o -name '*.plist' \) -print0 \
            | xargs -0 grep -Il $'\r'; then
            echo 'CRLF found in macOS runtime files' >&2
            exit 1
          fi

          cd "$(dirname "$dmg")"
          shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256"

      - name: Upload verified macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BX24_Chat_Sorter_macOS_Universal_v${{ steps.version.outputs.version }}
          path: |
            dist/BX24_Chat_Sorter_macOS_Universal_v${{ steps.version.outputs.version }}.dmg
            dist/BX24_Chat_Sorter_macOS_Universal_v${{ steps.version.outputs.version }}.dmg.sha256
          if-no-files-found: error
          retention-days: 14

