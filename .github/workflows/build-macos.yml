name: Build and publish installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify frozen release source
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Install test runtime
        shell: pwsh
        run: |
          npm install --global pnpm@10.17.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium

      - name: Run all regressions
        shell: pwsh
        run: pnpm test

      - name: Verify project context
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/update-project-context.ps1 -Check

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-diagnostics-${{ github.sha }}
          path: |
            tests/artifacts/*.json
            tests/artifacts/*.png
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    name: Build and verify Windows EXE
    runs-on: windows-2025
    timeout-minutes: 20
    needs: verify-source

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read and verify version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'extension/manifest.json' -Raw | ConvertFrom-Json).version
          if (-not $version) { throw 'Manifest version is empty' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match manifest v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and hash installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler 'installers\windows\setup.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\PENA_Agency_Windows_v$env:VERSION.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Installer was not built: $exe" }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($exe))" | Set-Content -LiteralPath "$exe.sha256" -Encoding ascii

      - name: Upload verified Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PENA_Agency_Windows_v${{ steps.version.outputs.version }}
          path: |
            dist/PENA_Agency_Windows_v${{ steps.version.outputs.version }}.exe
            dist/PENA_Agency_Windows_v${{ steps.version.outputs.version }}.exe.sha256
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build and verify Universal DMG
    runs-on: macos-15
    timeout-minutes: 20
    needs: verify-source

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.7
          cache: false

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/bin/python3 -c 'import json; print(json.load(open("extension/manifest.json", encoding="utf-8"))["version"])')"
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest v${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Universal DMG
        shell: bash
        run: bash installers/macos/build.sh

      - name: Verify application and disk image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dmg="$GITHUB_WORKSPACE/dist/PENA_Agency_macOS_Universal_v${VERSION}.dmg"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/pena-bx24-mount.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet 2>/dev/null || true
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          test -s "$dmg"
          hdiutil verify "$dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -noautoopen -mountpoint "$mount_dir"

          app="$mount_dir/PENA BX24 Installer.app"
          executable="$app/Contents/MacOS/PENA BX24 Installer"
          launcher="$app/Contents/Resources/pena-launcher"
          launcher_info="$app/Contents/Resources/launcher-Info.plist"
          test -d "$app"
          test -x "$executable"
          plutil -lint "$app/Contents/Info.plist"
          plutil -lint "$launcher_info"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = "12.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$launcher_info")" = "12.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$launcher_info")" = "__VERSION__"
          grep -Fq 's|__VERSION__|$VERSION|g' "$app/Contents/Resources/install-gui.sh"

          archs="$(lipo -archs "$executable")"
          [[ " $archs " == *" x86_64 "* ]]
          [[ " $archs " == *" arm64 "* ]]
          launcher_archs="$(lipo -archs "$launcher")"
          [[ " $launcher_archs " == *" x86_64 "* ]]
          [[ " $launcher_archs " == *" arm64 "* ]]

          visible_count="$(find "$mount_dir" -mindepth 1 -maxdepth 1 ! -name '.*' | wc -l | tr -d ' ')"
          test "$visible_count" = "1"
          test -d "$app/Contents/Resources/extension"
          test -x "$app/Contents/Resources/install-gui.sh"
          test -x "$app/Contents/Resources/pena-updater.sh"
          test -x "$launcher"

          if find "$app/Contents/Resources" -type f \( -name '*.sh' -o -name '*.plist' \) -print0 \
            | xargs -0 grep -Il $'\r'; then
            echo 'CRLF found in macOS runtime files' >&2
            exit 1
          fi

          cd "$(dirname "$dmg")"
          shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256"

      - name: Upload verified macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PENA_Agency_macOS_Universal_v${{ steps.version.outputs.version }}
          path: |
            dist/PENA_Agency_macOS_Universal_v${{ steps.version.outputs.version }}.dmg
            dist/PENA_Agency_macOS_Universal_v${{ steps.version.outputs.version }}.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: PENA_Agency_*
          path: dist
          merge-multiple: true

      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          windows="dist/PENA_Agency_Windows_v${version}.exe"
          macos="dist/PENA_Agency_macOS_Universal_v${version}.dmg"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "4"
          for artifact in "$windows" "$macos"; do
            test -s "$artifact"
            test -s "$artifact.sha256"
            expected="$(awk '{print $1}' "$artifact.sha256")"
            actual="$(sha256sum "$artifact" | awk '{print $1}')"
            test "$expected" = "$actual"
          done

      - name: Publish installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Automatically loads complete native dialog lists on first Bitrix startup.' \
            'Optimizes native sort-key merging and metadata comparisons.' \
            'Coalesces time catalog refreshes and verifies delayed first-open recovery.' \
            'Includes Windows EXE and Universal macOS DMG for Intel and Apple Silicon.' \
            > release-notes.md
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              "dist/PENA_Agency_Windows_v${GITHUB_REF_NAME#v}.exe" \
              "dist/PENA_Agency_Windows_v${GITHUB_REF_NAME#v}.exe.sha256" \
              "dist/PENA_Agency_macOS_Universal_v${GITHUB_REF_NAME#v}.dmg" \
              "dist/PENA_Agency_macOS_Universal_v${GITHUB_REF_NAME#v}.dmg.sha256"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "PENA BX24 ${GITHUB_REF_NAME}" --notes-file release-notes.md \
              "dist/PENA_Agency_Windows_v${GITHUB_REF_NAME#v}.exe" \
              "dist/PENA_Agency_Windows_v${GITHUB_REF_NAME#v}.exe.sha256" \
              "dist/PENA_Agency_macOS_Universal_v${GITHUB_REF_NAME#v}.dmg" \
              "dist/PENA_Agency_macOS_Universal_v${GITHUB_REF_NAME#v}.dmg.sha256"
          fi
